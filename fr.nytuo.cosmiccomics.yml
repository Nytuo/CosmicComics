app-id: fr.nytuo.cosmiccomics
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: cosmiccomics
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=/media
  - --filesystem=/run/media

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
  env:
    CARGO_HOME: /run/build/cosmiccomics/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: cosmiccomics
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/cosmiccomics/flatpak-node/cache
        npm_config_cache: /run/build/cosmiccomics/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - cd src && npm ci --offline --ignore-scripts
      - cd src && npm run build:vite
      - cd src/src-tauri && cargo --offline build --release --no-default-features --features tauri/custom-protocol
      - install -Dm755 src/src-tauri/target/release/cosmiccomics ${FLATPAK_DEST}/bin/cosmiccomics
      - install -Dm644 src/src-tauri/icons/128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 src/src-tauri/icons/128x128@2x.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: dir
        path: .
        skip:
          - build
          - build-dir
          - repo
          - .flatpak-builder
          - src/node_modules
          - src/dist
          - src/src-tauri/target
      - cargo-sources.json
      - node-sources.json
