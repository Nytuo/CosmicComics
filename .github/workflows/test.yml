name: test

# Checks only: nothing is bundled, no artifact is produced. Runs on pull
# requests and when dispatched by hand, never on push, tag or schedule.
#
#   frontend  React/TypeScript: typecheck, formatting, lint
#   desktop   Rust backend unit tests, run on Linux
#   android   Rust backend compiles for Android (arm64)
#   ios       Rust backend compiles for iOS (arm64)
#
# The Android and iOS jobs compile with `cargo check` instead of running the
# tests: the tests run on the desktop job, and this is what catches a
# dependency that stops building for a phone. Releases (and their long
# builds) live in release.yml.

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - run: npm ci

      # Each check reports even when an earlier one failed.
      - name: Typecheck
        run: npm run typecheck

      - name: Formatting
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

  desktop:
    name: Backend tests (Rust, desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      # tauri::generate_context! only needs the frontend folder to exist, so a
      # placeholder saves installing Node and running vite.
      - name: Placeholder frontend
        run: |
          mkdir -p src/dist
          echo '<!doctype html>' > src/dist/index.html

      # googlebooks needs an API key and anilist calls the live AniList API:
      # a third-party outage should not turn a pull request red.
      - name: Unit tests
        working-directory: src/src-tauri
        run: cargo test --lib -- --skip googlebooks --skip anilist

  android:
    name: Backend compiles for Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - name: Placeholder frontend
        run: |
          mkdir -p src/dist
          echo '<!doctype html>' > src/dist/index.html

      # The runner image already ships an NDK. The C/C++ dependencies (unrar,
      # ring ...) are compiled by cc-rs, which needs to be pointed at it; API 24
      # is the minimum Android version the app supports.
      - name: Check
        working-directory: src/src-tauri
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          [ -d "$NDK" ] || { echo "::error::no Android NDK found on the runner"; exit 1; }
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$BIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          cargo check --lib --target aarch64-linux-android

  ios:
    name: Backend compiles for iOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - name: Placeholder frontend
        run: |
          mkdir -p src/dist
          echo '<!doctype html>' > src/dist/index.html

      - name: Check
        working-directory: src/src-tauri
        run: cargo check --lib --target aarch64-apple-ios
