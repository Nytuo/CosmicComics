name: mobile


on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/src-tauri/**'
      - 'src/package.json'
      - '.github/workflows/mobile.yml'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Backend tests (archives, Jellyfin client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
        working-directory: src
      - run: npm run build:vite
        working-directory: src
      - run: cargo test --lib -- --skip googlebooks
        working-directory: src/src-tauri

  ios-check:
    name: iOS compile check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
        working-directory: src
      - run: npm run build:vite
        working-directory: src
      - run: cargo check --lib --target aarch64-apple-ios
        working-directory: src/src-tauri

  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: |
          sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
        working-directory: src
      - run: npx tauri android init --ci
        working-directory: src
      - run: npx tauri android build --debug --apk --target aarch64
        working-directory: src
      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-comics-android-debug
          path: src/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
